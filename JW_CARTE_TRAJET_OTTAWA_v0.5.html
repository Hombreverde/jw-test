,-75.6925],[45.42692,-75.69248],[45.42692,-75.69245],[45.42693,-75.69243],[45.42694,-75.69241],[45.42696,-75.6924],[45.42695,-75.69237],[45.42696,-75.69235],[45.42697,-75.69232],[45.42698,-75.69231],[45.42699,-75.69229],[45.427,-75.69227],[45.427,-75.69226],[45.427,-75.69225],[45.42701,-75.69223],[45.42702,-75.69222],[45.42702,-75.6922],[45.42703,-75.69219],[45.42704,-75.69217],[45.42704,-75.69216],[45.42705,-75.69214],[45.42707,-75.69214],[45.42708,-75.69214],[45.4271,-75.69214],[45.42712,-75.69215],[45.42713,-75.69216],[45.42714,-75.69217],[45.42717,-75.69216],[45.4272,-75.69216],[45.42723,-75.69218],[45.42725,-75.69221],[45.42726,-75.69223],[45.42727,-75.69224]],"lms":[{"name":"Musée des beaux-arts du Canada","kind":"musée","lat":45.42952,"lon":-75.69869},{"name":"Maman (l’araignée de Louise Bourgeois)","kind":"œuvre","lat":45.42933,"lon":-75.69726},{"name":"Basilique-cathédrale Notre-Dame","kind":"église","lat":45.42979,"lon":-75.69636},{"name":"Monument Samuel de Champlain","kind":"monument","lat":45.42952,"lon":-75.70102},{"name":"Kichi Zibi Innini (le guetteur anishinabe)","kind":"œuvre","lat":45.42986,"lon":-75.70124},{"name":"Belvédère de la pointe Kìwekì","kind":"vue","lat":45.42958,"lon":-75.70161},{"name":"Parc Major’s Hill","kind":"parc","lat":45.42725,"lon":-75.69749},{"name":"Statue du colonel John By","kind":"monument","lat":45.42644,"lon":-75.69699},{"name":"Ruines de la maison du colonel By","kind":"repère","lat":45.42768,"lon":-75.69791},{"name":"Monument au maintien de la paix (Réconciliation)","kind":"monument","lat":45.4288,"lon":-75.69679},{"name":"Musée Bytown (l’auvent vert des écluses)","kind":"musée","lat":45.42585,"lon":-75.69767},{"name":"Les huit écluses du canal Rideau","kind":"vue","lat":45.42483,"lon":-75.69521},{"name":"Fairmont Château Laurier","kind":"bâtiment","lat":45.42558,"lon":-75.69522},{"name":"Sénat du Canada (1 Wellington)","kind":"bâtiment","lat":45.42464,"lon":-75.69358},{"name":"Monument aux Valeureux","kind":"monument <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const cv = document.getElementById("map"), cx = cv.getContext("2d");

const LAT0 = 45.427, KX = 111320*Math.cos(LAT0*Math.PI/180), KY = 110574;
const mx = p => p[1]*KX, my = p => p[0]*KY;   // [lat,lon] -> mètres

/* vue */
let scale = 1, ox = 0, oy = 0;                 // px par mètre, origine
function fit(){
  const xs = D.new_line.map(mx), ys = D.new_line.map(my);
  const x0 = Math.min(...xs)-140, x1 = Math.max(...xs)+140;
  const y0 = Math.min(...ys)-140, y1 = Math.max(...ys)+140;
  scale = Math.min(innerWidth/(x1-x0), innerHeight/(y1-y0));
  ox = (innerWidth  - (x0+x1)*scale)/2;
  oy = (innerHeight + (y0+y1)*scale)/2;
}
const px = p => ox + mx(p)*scale;
const py = p => oy - my(p)*scale;

/* thème */
let C = {};
function theme(){
  const s = getComputedStyle(document.documentElement);
  for(const k of ["bg","water","build","street","major","path","new","new-halo","old","raw","disc","ink","sub","bad","ok","panel","line","lm","lm-ring"])
    C[k] = s.getPropertyValue("--"+k).trim();
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{theme();draw();});
new MutationObserver(()=>{theme();draw();}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

function poly(lines, close){
  cx.beginPath();
  for(const l of lines){
    cx.moveTo(px(l[0]), py(l[0]));
    for(let i=1;i<l.length;i++) cx.lineTo(px(l[i]), py(l[i]));
    if(close) cx.closePath();
  }
}
function stroke(lines, col, w, dash){
  poly(lines,false);
  cx.strokeStyle=col; cx.lineWidth=w; cx.lineJoin="round"; cx.lineCap="round";
  cx.setLineDash(dash||[]); cx.stroke(); cx.setLineDash([]);
}

let sel = null;
function draw(){
  const dpr = devicePixelRatio||1;
  if(cv.width!==innerWidth*dpr||cv.height!==innerHeight*dpr){
    cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
    cv.style.width=innerWidth+"px"; cv.style.height=innerHeight+"px";
  }
  cx.setTransform(dpr,0,0,dpr,0,0);
  cx.fillStyle=C.bg; cx.fillRect(0,0,innerWidth,innerHeight);

  poly(D.water,true); cx.fillStyle=C.water; cx.fill();
  poly(D.builds,true); cx.fillStyle=C.build; cx.fill();
  stroke(D.paths, C.path, Math.max(.6,.9*scale));
  stroke(D.steps, C.path, Math.max(1,1.6*scale), [3,2.4]);
  stroke(D.streets, C.street, Math.max(1.2,5*scale));
  stroke(D.majors, C.major, Math.max(1.8,9*scale));

  if(ly.O.checked) stroke([D.old_line], C.old, 3, [7,5]);
  if(ly.R.checked) stroke([D.raw], C.raw, 1.6);
  if(ly.N.checked){
    stroke([D.new_line], C["new-halo"], 7.5);
    stroke([D.new_line], C["new"], 4.5);
  }

  /* landmarks */
  if(ly.L.checked){
    cx.textAlign="center"; cx.textBaseline="middle";
    for(const l of D.lms){
      const x=px([l.lat,l.lon]), y=py([l.lat,l.lon]);
      cx.save(); cx.translate(x,y); cx.rotate(Math.PI/4);
      cx.fillStyle=C.lm; cx.strokeStyle=C["lm-ring"]; cx.lineWidth=1.6;
      const r=sel===l.name?7.5:6;
      cx.beginPath(); cx.rect(-r,-r,2*r,2*r); cx.fill(); cx.stroke(); cx.restore();
      if(scale>1.05){
        const t=l.name.replace(/ \(.*\)$/,"");
        cx.font="600 10.5px system-ui"; cx.textAlign="left";
        cx.lineWidth=3.2; cx.strokeStyle=C.bg; cx.strokeText(t,x+10,y-9);
        cx.fillStyle=C.lm; cx.fillText(t,x+10,y-9); cx.textAlign="center";
      }
    }
  }

  /* repères */
  cx.font="600 11px system-ui"; cx.textAlign="center"; cx.textBaseline="middle";
  for(const k of D.marks){
    const x=px([k.lat,k.lon]), y=py([k.lat,k.lon]);
    if(k.k==="auto"){
      cx.fillStyle=C.ink; cx.beginPath(); cx.arc(x,y,9,0,7); cx.fill();
      cx.fillStyle=C.bg; cx.font="700 11px system-ui"; cx.fillText("P",x,y+.5);
    }else if(k.k==="photo"){
      cx.font="13px system-ui"; cx.fillText("📷",x,y-14);
    }else{
      cx.strokeStyle=C.bad; cx.lineWidth=2.4; cx.beginPath();
      cx.moveTo(x-5,y-5); cx.lineTo(x+5,y+5); cx.moveTo(x+5,y-5); cx.lineTo(x-5,y+5); cx.stroke();
    }
  }

  /* départ (pastille « D » de l'app — le trajet commence ici, pas à l'arrêt 1) */
  if(ly.N.checked){
    const s0=D.new_line[0], x=px(s0), y=py(s0);
    cx.beginPath(); cx.arc(x,y,11.5,0,7);
    cx.fillStyle=C.ok; cx.fill();
    cx.lineWidth=2.5; cx.strokeStyle=C.disc; cx.stroke();
    cx.fillStyle=C.disc; cx.font="800 13px system-ui";
    cx.textAlign="center"; cx.textBaseline="middle"; cx.fillText("D",x,y+.5);
    if(scale>.55){
      cx.font="700 11px system-ui"; cx.textAlign="left";
      cx.lineWidth=3.5; cx.strokeStyle=C.bg; cx.strokeText("Départ (Go)",x+16,y+12);
      cx.fillStyle=C.ok; cx.fillText("Départ (Go)",x+16,y+12); cx.textAlign="center";
    }
  }

  /* arrêts */
  for(const s of D.stops){
    const x=px([s.lat,s.lon]), y=py([s.lat,s.lon]);
    cx.beginPath(); cx.arc(x,y,10.5,0,7);
    cx.fillStyle=C.disc; cx.fill();
    cx.lineWidth = sel===s.n?3:2; cx.strokeStyle=C["new"]; cx.stroke();
    cx.fillStyle=C["new"]; cx.font="700 12px system-ui"; cx.fillText(s.n,x,y+.5);
    if(scale>.55){
      const t=s.name.replace("Musée des beaux-arts du Canada","Musée des beaux-arts")
                    .replace(" — retour"," (retour)");
      cx.font="600 11px system-ui"; cx.textAlign="left";
      cx.lineWidth=3.5; cx.strokeStyle=C.bg; cx.strokeText(t,x+15,y);
      cx.fillStyle=C.ink; cx.fillText(t,x+15,y); cx.textAlign="center";
    }
  }

  /* échelle */
  const target=80/scale, nice=[25,50,100,200,500,1000].reduce((a,b)=>Math.abs(b-target)<Math.abs(a-target)?b:a);
  document.getElementById("scale").innerHTML='<b style="width:'+(nice*scale)+'px"></b><span>'+(nice>=1000?"1 km":nice+" m")+"</span>";
}

/* couches */
const ly={N:document.getElementById("lyN"),O:document.getElementById("lyO"),R:document.getElementById("lyR"),L:document.getElementById("lyL")};
for(const k in ly) ly[k].addEventListener("change",draw);

/* pan / zoom */
const ptrs=new Map(); let pinch0=0, scale0=1;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,[e.clientX,e.clientY]); cv.classList.add("drag");
  if(ptrs.size===2){const p=[...ptrs.values()];pinch0=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);scale0=scale;}
});
cv.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId); ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===1){ ox+=e.clientX-prev[0]; oy+=e.clientY-prev[1]; draw(); }
  else if(ptrs.size===2){
    const p=[...ptrs.values()], d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
    const cxm=(p[0][0]+p[1][0])/2, cym=(p[0][1]+p[1][1])/2;
    zoomAt(cxm,cym, scale0*d/pinch0/scale);
  }
});
const up=e=>{ptrs.delete(e.pointerId); if(!ptrs.size)cv.classList.remove("drag");};
cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0016));},{passive:false});
function zoomAt(x,y,f){
  f=Math.max(.12/scale,Math.min(30/scale,f));
  ox=x-(x-ox)*f; oy=y-(y-oy)*f; scale*=f; draw();
}
document.getElementById("zin").onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1.45);
document.getElementById("zout").onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1/1.45);
document.getElementById("zfit").onclick=()=>{fit();draw();};

/* sélection d'un arrêt */
cv.addEventListener("click",e=>{
  let best=null,bd=22;
  const pool=[...D.stops, ...D.marks, ...(ly.L.checked?D.lms:[])];
  for(const s of pool){
    const d=Math.hypot(px([s.lat,s.lon])-e.clientX, py([s.lat,s.lon])-e.clientY);
    if(d<bd){bd=d;best=s;}
  }
  sel=best?(best.n||best.name):null;
  const el=document.getElementById("pick");
  el.style.display=best?"block":"none";
  if(best) el.textContent=(best.n?best.n+". "+best.name:best.name+(best.kind?" — "+best.kind:""));
  draw();
});

addEventListener("resize",()=>{draw();});
theme(); fit(); draw();
